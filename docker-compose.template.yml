services:
  edge-ai-demo-studio:
    image: harbor.edgesync.cloud/intel/edge-ai-demo-studio:v1.0.0
    container_name: edge-ai-demo-studio
    # devices: # Uncomment if you have a GPU/NPU
    #   - "/dev/dri:/dev/dri" # Uncomment if you have a GPU
    #   - "/dev/accel:/dev/accel" # Uncomment if you have an NPU
    # group_add: # Uncomment if you have a GPU/NPU
    #   - ${RENDER_GROUP_ID:-992} # Uncomment if you have a GPU/NPU (render group)
    network_mode: host
    environment:
      - DATABASE_URL=file:/home/ubuntu/data/db.sqlite
      - NEXT_MANUAL_SIG_HANDLE=true
      # llama.cpp build for LLMs: sycl or vulkan (the image has both)
      - LLAMACPP_BACKEND=${LLAMACPP_BACKEND:-sycl}
    volumes:
      - models:/home/ubuntu/models
      - logs:/home/ubuntu/logs
      - db:/home/ubuntu/data

volumes:
  models:
  logs:
  db:
